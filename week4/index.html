<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet", href="style.css">
</head>
<body>
    <div class="page">
        <header>
            <img src="./assets/likelion.png" alt="likelion" />
            <p>회원 가입을 위해 정보를 입력해주세요</p>
        </header>

        <main>
            <div class="info" id="email">
                <p>* 이메일</p>
            </div>
            <div class="info">
                <p>* 이름</p>
            </div>
            <div class="info">
                <p>* 비밀번호</p>
            </div>
            <div class="info">
                <p>* 비밀번호 확인</p>
            </div>

            <div class="gender">
                <div class="gender__box">
                    <div class="gender__box__button"></div>
                    <p>여성</p>
                </div>
                <div class="gender__box">
                    <div class="gender__box__button"></div>
                    <p>남성</p>
                </div>
            </div>

            <div class="agree">
                <div class="agree__button"></div>
                <p>이용약관 개인정보 수집 및 이용, 마케팅 활용 선택에 모두 동의합니다.</p>
            </div>
        </main>

        <footer>
            <p>가입하기</p>
        </footer>
    </div>
</body>
</html>
